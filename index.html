<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<script src="./native.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#004ac6"/>
<title>FreeZone BD</title>
<script>
  /* the saved theme, before the page is drawn */
  (function () {
    try {
      var m = localStorage.getItem("fz-theme");
      if (m === "dark" || (m !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="theme.css"/>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: rgb(var(--c-slate-surface)); color: rgb(var(--c-on-surface));
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  .splash { text-align: center; animation: in .5s ease-out both; }
  .logo {
    width: 88px; height: 88px; margin: 0 auto 18px; border-radius: 26px;
    background: rgb(var(--c-primary-container)); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 28px rgb(var(--c-primary-container) / .35);
  }
  .logo svg { width: 50px; height: 50px; }
  h1 { margin: 0; font-size: 34px; line-height: 40px; font-weight: 800; letter-spacing: -0.03em; color: rgb(var(--c-primary)); }
  html.dark h1 { color: rgb(var(--c-on-surface)); }
  p { margin: 4px 0 0; font-size: 14px; font-weight: 500; color: rgb(var(--c-slate-muted)); }
  .dots { margin-top: 28px; display: flex; gap: 7px; justify-content: center; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--c-primary-container)); opacity: .25; animation: dot 1.1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .18s; }
  .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes in { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes dot { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .splash, .dots i { animation: none; } .dots i { opacity: .6; } }
</style>
</head>
<body>
  <div class="splash" role="status" aria-label="FreeZone BD is loading">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 3h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H9l-4 4v-4H4a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z" opacity=".55"/><path d="M8 8h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-1v3.2L15.2 20H8a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3z"/></svg>
    </div>
    <h1>FreeZone BD</h1>
    <p>Connect. Share. Chat.</p>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <noscript><meta http-equiv="refresh" content="0; url=./feed.html"/></noscript>

<script type="module">
  // The splash is shown for at least MIN_MS (so the logo is seen) and at most MAX_MS (3 seconds).
  // Signed in -> feed.html. Signed out -> login.html (then back to the page that was asked for).
  // If the check cannot finish in time (slow network) the feed opens: it sends a signed-out person to the login page itself.
  const MIN_MS = 1200;
  const MAX_MS = 3000;
  const started = Date.now();
  const rest = location.search + location.hash;
  let done = false;

  function go(url) {
    if (done) return;
    done = true;
    location.replace(url);
  }
  const goFeed = () => go("./feed.html" + rest);
  const goLogin = () => go(rest ? "./login.html?next=" + encodeURIComponent("feed.html" + rest) : "./login.html");
  const later = (fn) => setTimeout(fn, Math.max(0, MIN_MS - (Date.now() - started)));

  const timeout = setTimeout(goFeed, MAX_MS);

  try {
    const [{ auth }, { onAuthStateChanged }] = await Promise.all([
      import("./config.js"),
      import("https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js")
    ]);
    // the first answer says whether a saved sign-in exists
    const off = onAuthStateChanged(auth, (user) => {
      off();
      clearTimeout(timeout);
      later(user ? goFeed : goLogin);
    }, () => { clearTimeout(timeout); later(goFeed); });
  } catch (error) {
    clearTimeout(timeout);
    later(goFeed);
  }
</script>
</body>
</html>
