<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<script src="./i18n.js"></script>
<script src="./native.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#004ac6"/>
<title>FreeZone BD</title>
<script>
  /* the saved theme, before the page is drawn */
  (function () {
    try {
      var m = localStorage.getItem("fz-theme");
      if (m === "dark" || (m !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="theme.css"/>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #0560e8 radial-gradient(ellipse at 50% 52%, #097aff 0%, #0563ec 48%, #004bd3 100%) fixed;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  .splash { text-align: center; animation: in .5s ease-out both; }
  .logo {
    display: block; width: min(86vw, 420px); height: auto; margin: 0 auto;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent), linear-gradient(180deg, transparent, #000 9%, #000 91%, transparent);
    -webkit-mask-composite: source-in; mask-composite: intersect;
  }
  .dots { margin-top: 8px; display: flex; gap: 7px; justify-content: center; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: .3; animation: dot 1.1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .18s; }
  .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes dot { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .splash, .dots i { animation: none; } .dots i { opacity: .7; } }
</style>
</head>
<body>
  <div class="splash" role="status" aria-label="FreeZone BD is loading">
    <img class="logo" src="logo.png" width="512" height="512" alt="FreeZone BD"/>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <noscript><meta http-equiv="refresh" content="0; url=./feed.html"/></noscript>

<script type="module">
  // The splash is shown for at least MIN_MS (so the logo is seen) and at most MAX_MS (3 seconds).
  // Signed in -> feed.html. Signed out -> login.html (then back to the page that was asked for).
  // If the check cannot finish in time (slow network) the feed opens: it sends a signed-out person to the login page itself.
  const MIN_MS = 1200;
  const MAX_MS = 3000;
  const started = Date.now();
  const rest = location.search + location.hash;
  let done = false;

  function go(url) {
    if (done) return;
    done = true;
    location.replace(url);
  }
  const goFeed = () => go("./feed.html" + rest);
  const goLogin = () => go(rest ? "./login.html?next=" + encodeURIComponent("feed.html" + rest) : "./login.html");
  const later = (fn) => setTimeout(fn, Math.max(0, MIN_MS - (Date.now() - started)));

  const timeout = setTimeout(goFeed, MAX_MS);

  try {
    const [{ auth }, { onAuthStateChanged }] = await Promise.all([
      import("./config.js"),
      import("https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js")
    ]);
    // the first answer says whether a saved sign-in exists
    const off = onAuthStateChanged(auth, (user) => {
      off();
      clearTimeout(timeout);
      later(user ? goFeed : goLogin);
    }, () => { clearTimeout(timeout); later(goFeed); });
  } catch (error) {
    clearTimeout(timeout);
    later(goFeed);
  }
</script>
</body>
</html>
