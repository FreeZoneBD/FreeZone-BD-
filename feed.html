<style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal;
      font-size: 22px; line-height: 1; display: inline-block; text-transform: none;
      letter-spacing: normal; word-wrap: normal; white-space: nowrap; direction: ltr;
      -webkit-font-smoothing: antialiased;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { min-height: max(884px, 100dvh); }
    /* the app column is 720px wide at most: fills a phone or a tablet, stays centred on a laptop */
    html .max-w-lg { max-width: 45rem; }
    /* in a flex column a centred child shrinks to its content: make sub pages (Language, About, Change password...) fill the column */
    #pageViewBody > .max-w-lg, #postDetail .max-w-lg.mx-auto { width: 100%; }
    /* wide screens (laptop, tablet, phone in desktop mode): full pages such as Profile, Settings and a post open in the same centred column as the feed */
    @media (min-width: 600px) {
      #pageView, #postDetail { left: 0; right: 0; max-width: 45rem; margin: 0 auto; border-left: 1px solid rgba(128,128,128,.18); border-right: 1px solid rgba(128,128,128,.18); }
    }
    [hidden] { display: none !important; }
        .liked .like-icon { font-variation-settings: 'FILL' 1; }
    /* feed post card: heart that pops up on a double tap, and the pop of the like button */
    .fz-burst { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; }
    .fz-burst svg { width: 96px; height: 96px; filter: drop-shadow(0 4px 14px rgba(0,0,0,.35)); }
    .fz-burst.go { animation: fzBurst .75s ease-out; }
    @keyframes fzBurst {
      0% { opacity: 0; transform: scale(.4); }
      25% { opacity: 1; transform: scale(1.15); }
      60% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.05); }
    }
    .like-btn.pop svg { animation: fzPop .35s ease; }
    @keyframes fzPop { 0% { transform: scale(.7); } 55% { transform: scale(1.25); } 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .fz-burst.go, .like-btn.pop svg { animation: none; }
      .fz-burst.go { opacity: 1; }
    }
    /* Posts sit directly on each other, separated by one thin black line (light grey-white in dark mode) */
    #postsContainer { --fz-sep: #000; }
    html.dark #postsContainer { --fz-sep: rgba(255,255,255,.4); }
    #postsContainer > * { border-top-width: 0 !important; border-bottom: 1px solid var(--fz-sep) !important; }
    #postsContainer .fz-ad-slot:not(.fz-open) { border-bottom-width: 0 !important; }
    #postsContainer .fz-ad-slot article { border-width: 0 !important; }
    /* ===== Top bar, create button and bottom nav (custom SVG icon set) ===== */
    .fz-topbar, .fz-bottomnav { --fz-ink: #0f1419; --fz-soft: #536471; --fz-on-ink: #fff; --fz-brand: #1d9bf0; }
    html.dark .fz-topbar, html.dark .fz-bottomnav { --fz-ink: #e7e9ea; --fz-soft: #8b98a5; --fz-on-ink: #0f1419; --fz-brand: #4db3f5; }
    .fz-topbar {
      background: rgb(var(--c-slate-surface) / .86);
      -webkit-backdrop-filter: saturate(180%) blur(14px); backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid rgb(var(--c-slate-border) / .6);
    }
    /* one icon style everywhere: 24px grid, rounded line icons; the active one is solid */
    .fz-svg { width: 26px; height: 26px; display: block; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .fz-svg.on { fill: currentColor; stroke: currentColor; stroke-width: 1.2; }
    .fz-ico { position: relative; width: 26px; height: 26px; display: block; }
    .fz-ico .on { display: none; }
    .fz-active .fz-ico .off { display: none; }
    .fz-active .fz-ico .on { display: block; }

    /* brand */
    .fz-brand-text { display: inline-flex; align-items: baseline; gap: 5px; font-size: 21px; line-height: 1; font-weight: 800; letter-spacing: -0.035em; color: var(--fz-ink); }
    .fz-brand-bd { font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(135deg, #1d9bf0 0%, #6366f1 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }

    /* profile photo (top left): a thin ring that lights up when pressed */
    .fz-avatar-btn { width: 40px; height: 40px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; transition: transform .15s, opacity .15s; }
    .fz-avatar-btn:active { transform: scale(.92); opacity: .85; }
    .fz-avatar { width: 34px; height: 34px; border-radius: 9999px; background: rgb(var(--c-surface-container)); box-shadow: 0 0 0 2px rgb(var(--c-slate-surface)), 0 0 0 3.5px rgb(var(--c-slate-border)); color: var(--fz-soft); }
    .fz-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .fz-avatar .fz-svg { width: 20px; height: 20px; stroke-width: 1.8; }

    /* friends (top right) */
    .fz-create-btn { width: 40px; height: 40px; border-radius: 9999px; color: var(--fz-ink); display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; transition: background .15s, transform .15s; }
    .fz-create-btn:hover { background: rgb(var(--c-surface-container)); }
    .fz-create-btn:active { background: rgb(var(--c-surface-container)); transform: scale(.9); }

    /* Create: floating round button, bottom right, above the nav */
    .fz-fab { position: fixed; z-index: 55; width: 58px; height: 58px; border-radius: 9999px; color: #fff; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, #3ab0ff 0%, #1d9bf0 45%, #0b72d6 100%);
      right: max(16px, calc((100vw - 720px) / 2 + 16px)); bottom: calc(52px + env(safe-area-inset-bottom, 0px) + 16px);
      box-shadow: 0 8px 20px rgba(29,155,240,.42), 0 2px 6px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.35);
      -webkit-tap-highlight-color: transparent; transition: transform .15s, box-shadow .15s, filter .15s; }
    .fz-fab .fz-svg { width: 28px; height: 28px; stroke-width: 2.6; }
    .fz-fab:hover { filter: brightness(1.05); }
    .fz-fab:active { transform: scale(.92); box-shadow: 0 4px 12px rgba(29,155,240,.4), 0 1px 3px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.3); }

    /* bottom nav: line icons, the open one solid with a small dot under it */
    .fz-bottomnav {
      height: calc(52px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgb(var(--c-slate-surface) / .94); -webkit-backdrop-filter: saturate(180%) blur(14px); backdrop-filter: saturate(180%) blur(14px);
      border-top: 1px solid rgb(var(--c-slate-border) / .7);
    }
    .fz-nav-item { position: relative; justify-self: stretch; height: 52px; display: flex; align-items: center; justify-content: center; color: var(--fz-soft); -webkit-tap-highlight-color: transparent; transition: transform .12s ease, color .15s; }
    .fz-nav-item:active { transform: scale(.86); }
    .fz-nav-item.fz-active { color: var(--fz-ink); }
    .fz-nav-item.fz-active::after { content: ""; position: absolute; bottom: 5px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 9999px; background: var(--fz-brand); }
    /* the red number badges sit on the icon (their code puts them at the corner of the whole button) */
    .fz-nav-item .fz-notif-badge, .fz-nav-item .fz-chat-badge {
      top: 6px !important; right: auto !important; bottom: auto !important; left: calc(50% + 3px) !important; margin: 0 !important;
      min-width: 17px !important; height: 17px !important; padding: 0 4px !important; font-size: 10px !important; line-height: 1 !important;
      box-shadow: 0 0 0 2px rgb(var(--c-slate-surface)) !important; --tw-ring-shadow: 0 0 #0000 !important; --tw-ring-offset-shadow: 0 0 #0000 !important;
    }
    @media (prefers-reduced-motion: reduce) { .fz-nav-item, .fz-fab, .fz-avatar-btn, .fz-create-btn { transition: none; } }
    .skeleton {
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .fade-in {
      animation: fadeIn 0.35s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

        <div class="w-11 h-11 rounded-full skeleton"></div>
        <div class="space-y-2 flex-1">
          <div class="h-3.5 w-32 rounded skeleton"></div>
          <div class="h-3 w-20 rounded skeleton"></div>
        </div>
      </div>
      <div class="h-4 w-full rounded skeleton"></div>
      <div class="h-4 w-4/5 rounded skeleton"></div>
      <div class="h-40 w-full rounded-xl skeleton"></div>
    </div>
    <div class="bg-slate-surface border border-slate-border rounded-2xl p-4 space-y-3">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-full skeleton"></div>
        <div class="space-y-2 flex-1">
          <div class="h-3.5 w-28 rounded skeleton"></div>
          <div class="h-3 w-16 rounded skeleton"></div>
        </div>
      </div>
      <div class="h-4 w-full rounded skeleton"></div>
      <div class="h-4 w-3/5 rounded skeleton"></div>
    </div>
  </div>

  <!-- Empty state -->
  <div id="emptyState" class="text-center py-14 px-6" hidden>
    <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-primary-fixed/50 flex items-center justify-center">
      <span class="material-symbols-outlined text-[32px] text-primary">forum</span>
    </div>
    <p class="font-headline-sm text-headline-sm text-on-surface font-semibold mb-1">No posts yet</p>
    <p class="text-slate-muted font-body-sm text-body-sm">Be the first to share something with the community!</p>
  </div>

  <!-- Real-time posts -->
  <!-- full-width posts: the container reaches the screen edges, 8px between posts -->
  <div id="postsContainer" class="-mx-3 sm:-mx-4 flex flex-col"></div>

</main>

<!-- Create button: floating, bottom right (X style) -->
<button type="button" aria-label="Create Post" class="nav-link fz-fab" data-page="create" data-title="Create Post">
  <svg class="fz-svg" aria-hidden="true"><use href="#i-plus"/></svg>
</button>

<nav class="fz-bottomnav fixed bottom-0 left-0 right-0 z-50 max-w-lg mx-auto grid grid-cols-5 items-center">
  <a aria-label="Feed" class="fz-nav-item fz-active" href="#">
    <span class="fz-ico"><svg class="fz-svg off" aria-hidden="true"><use href="#i-home"/></svg><svg class="fz-svg on" aria-hidden="true"><use href="#i-home-f"/></svg></span>
  </a>
  <button aria-label="Search" class="nav-link fz-nav-item" data-page="search" data-title="Search">
    <span class="fz-ico"><svg class="fz-svg off" aria-hidden="true"><use href="#i-search"/></svg><svg class="fz-svg on" aria-hidden="true"><use href="#i-search-f"/></svg></span>
  </button>
  <button type="button" aria-label="Video" class="fz-nav-item" data-feature="reels">
    <span class="fz-ico"><svg class="fz-svg off" aria-hidden="true"><use href="#i-video"/></svg><svg class="fz-svg on" aria-hidden="true"><use href="#i-video-f"/></svg></span>
  </button>
  <button aria-label="Chat" class="nav-link fz-nav-item" data-page="chat" data-title="Chat">
    <span class="fz-ico"><svg class="fz-svg off" aria-hidden="true"><use href="#i-chat"/></svg><svg class="fz-svg on" aria-hidden="true"><use href="#i-chat-f"/></svg></span>
  </button>
  <button aria-label="Notifications" class="nav-link fz-nav-item relative" data-page="notifications" data-title="Notifications">
    <span class="fz-ico"><svg class="fz-svg off" aria-hidden="true"><use href="#i-bell"/></svg><svg class="fz-svg on" aria-hidden="true"><use href="#i-bell-f"/></svg></span>
  </button>
</nav>

<!-- Full-screen Post Detail -->
<div id="postDetail" class="fixed inset-0 z-[80] bg-background flex flex-col" hidden>
  <header class="w-full h-14 px-2 bg-slate-surface sticky top-0 flex items-center gap-2 shadow-sm flex-shrink-0 border-b border-slate-border/50">
    <button id="postDetailBack" aria-label="Back" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all">
      <span class="material-symbols-outlined text-[22px]">arrow_back</span>
    </button>
    <span class="font-headline-sm text-headline-sm font-semibold">Post</span>
  </header>
  <div id="postDetailBody" class="flex-1 overflow-y-auto px-3 sm:px-4 py-4 space-y-4"></div>
  <form id="postDetailCommentForm" class="flex items-center gap-2.5 p-3 border-t border-slate-border bg-slate-surface flex-shrink-0">
    <input id="postDetailCommentInput" type="text" class="flex-1 bg-surface-container-low border border-transparent focus:border-primary-container focus:ring-2 focus:ring-primary-container/15 rounded-full px-4 py-2.5 text-body-sm text-body-sm outline-none transition-all" placeholder="Write a comment..." maxlength="300" />
    <button type="submit" class="text-primary-container font-label-sm text-label-sm font-semibold px-3 py-2 rounded-full hover:bg-primary-fixed/40 active:scale-95 transition-all">Send</button>
  </form>
</div>

<!-- Shared full-screen view -->
<div id="pageView" class="fixed inset-0 z-[70] bg-background flex flex-col" hidden>
  <header class="w-full h-14 px-2 bg-slate-surface sticky top-0 flex items-center gap-2 shadow-sm flex-shrink-0 border-b border-slate-border/50">
    <button id="pageViewBack" aria-label="Back" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all">
      <span class="material-symbols-outlined text-[22px]">arrow_back</span>
    </button>
    <span id="pageViewTitle" class="font-headline-sm text-headline-sm font-semibold"></span>
    <div id="pageViewActions" class="ml-auto flex items-center gap-1"></div>
  </header>
  <div id="pageViewBody" class="flex-1 overflow-y-auto flex flex-col"></div>
</div>

<script type="module" src="./features.js"></script>
<script type="module" src="./push.js"></script>
<script type="module" src="./feed.js"></script>
<script src="./hide-bars.js" defer></script>
</body>
</html>
